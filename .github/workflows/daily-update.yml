name: Daily data update

on:
  schedule:
    - cron: "30 4 * * *" # every day 04:30 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Only run these shops (comma separated, e.g. Airalo). Empty = all."
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright (Airalo needs a real browser; it drives the preinstalled Chrome)
        run: python3 -m pip install --quiet playwright
      - name: Refresh prices from the shops' websites
        id: update
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set +e
          python3 scripts/update_data.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Check the data still builds
        run: python3 scripts/build.py
      - name: Commit new data (Cloudflare redeploys on push)
        run: |
          git config user.name "esim-compare bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/plans.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily data update $(date -u +%F)"
            # Someone may have pushed while the scrapers ran (they take ~15 minutes): replay on top, keeping the fresh data.
            git pull --rebase -X theirs
            git push
          fi
      - name: Open or update an issue when a shop failed
        if: steps.update.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-update --color FBCA04 --description "Daily data update problems" 2>/dev/null || true
          n=$(gh issue list --label data-update --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file report.md
          else
            gh issue create --title "Daily update: a shop failed ($(date -u +%F))" --label data-update --body-file report.md
          fi
