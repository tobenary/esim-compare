name: Weekly price check

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check vendor pages
        id: check
        run: |
          set +e
          python3 scripts/check_prices.py report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Open or update the review issue
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create price-check --color FBCA04 --description "Weekly price check" 2>/dev/null || true
          n=$(gh issue list --label price-check --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file report.md
          else
            gh issue create --title "Prices to review ($(date -u +%F))" --label price-check --body-file report.md
          fi
