name: Hourly data update (API shops)

# Shops that read a JSON API (about 3 minutes in total). The browser-driven shops (Airalo, ...) stay in the daily workflow.
on:
  schedule:
    - cron: "15 * * * *" # every hour at :15 UTC (GitHub may delay scheduled runs by several minutes)
  workflow_dispatch:
    inputs:
      only:
        description: "Shops to refresh (comma separated)"
        required: false
        default: "BNESIM,GigSky,Maya,AirHub"

permissions:
  contents: write

# Same group as the daily workflow: both rewrite data/plans.json, so they must not run at the same time.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh prices from the shops' APIs
        env:
          ONLY: ${{ inputs.only || 'BNESIM,GigSky,Maya,AirHub' }}
        run: |
          # A failing shop keeps its previous prices (marked stale); the daily workflow opens the issue, so don't fail the run here.
          python3 scripts/update_data.py || true
      - name: Check the data still builds
        run: python3 scripts/build.py
      - name: Commit only if plans changed (Cloudflare redeploys on push)
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys
          new = json.load(open("data/plans.json", encoding="utf-8"))
          old = json.loads(subprocess.run(["git", "show", "HEAD:data/plans.json"], capture_output=True, text=True, check=True).stdout)
          def plans(d):
              return {n: (p["status"], p["plans"]) for n, p in d["providers"].items()}
          if plans(new) == plans(old):
              subprocess.run(["git", "checkout", "--", "data/plans.json"], check=True)
              print("no plan changes, nothing to commit")
          EOF
          git config user.name "esim-compare bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/plans.json
          if ! git diff --cached --quiet; then
            git commit -m "Hourly data update $(date -u +%FT%H:%MZ)"
            git pull --rebase -X theirs
            git push
          fi
